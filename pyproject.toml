[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aido-audit-cav"
version = "1.0.0"
description = "AIDO-AUDIT-CAV reference implementation and frozen metric replay"
requires-python = ">=3.10"
dependencies = []
license = {text = "Apache-2.0"}

[project.scripts]
aido-cav = "aido_cav.cli:main"

[tool.setuptools]
packages = ["aido_cav"]
